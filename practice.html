<section>
<h2>اليوم 1: البيانات أصلٌ يُدار</h2>
<ol>
<li><p>في خدمة الرعاية المنزلية، اعتمدت اللجنة أن تُمحى صور المنازل بعد ستة أشهر من الزيارة. أين يقع هذا الحدث؟</p><ul><li><b>أ.</b> عمل إدارة يُنفَّذ في مرحلة الإتلاف</li><li><b>ب.</b> قرار حوكمة في مرحلة الإتلاف</li><li><b>ج.</b> قرار حوكمة في مرحلة التخزين والحفظ</li><li><b>د.</b> عمل إدارة في مرحلة الإنشاء</li></ul></li>
<li><p>لاحظت مديرة الرعاية المنزلية أن ثلث الزيارات المسجلة بلا نتيجة، فلا تُعرف الحالات التي تحتاج زيارة ثانية. ما المجال، وما أول مخرج عمل؟</p><ul><li><b>أ.</b> حوكمة البيانات: استراتيجية جديدة</li><li><b>ب.</b> البيانات الوصفية: مدخل كتالوج للجدول</li><li><b>ج.</b> تخزين البيانات: خطة نسخ احتياطي</li><li><b>د.</b> جودة البيانات: قاعدة وسجل مشكلات</li></ul></li>
<li><p>تريد البلدية عدد زيارات الرعاية المنزلية لكل حي كل شهر. صاغت المنسقة الطلب، وجهّز المهندس الملف. من يوافق على المشاركة؟</p><ul><li><b>أ.</b> مديرة الرعاية المنزلية بصفتها المالكة</li><li><b>ب.</b> المهندس لأنه يملك النظام ويعرف البيانات</li><li><b>ج.</b> لجنة إدارة البيانات في اجتماعها القادم</li><li><b>د.</b> المنسقة لأنها صاغت الطلب ودرسته</li></ul></li>
<li><p>وجد مسح نظام الرعاية جدولًا اسمه visits_backup_2023: نسخة من جدول الزيارات أُخذت قبل ترقية النظام، ولا يستخدمها أحد. ماذا تفعل في السجل؟</p><ul><li><b>أ.</b> تسجله أصلًا مستقلًا له مالك ومشرفان</li><li><b>ب.</b> تتجاهله لأنه لا يُستخدم في أي عمل</li><li><b>ج.</b> تذكره في ملاحظات أصله وتسأل المالك</li><li><b>د.</b> تطلب من المهندس حذفه من النظام اليوم</li></ul></li>
<li><p>في المراكز المجتمعية، تُرسل قائمة المشتركين في دورة التدريب كل أسبوع إلى المدرب بالبريد. من يتخذ القرار في السؤال: «هل يجوز أن تُرسل القائمة بأرقام الجوالات؟»</p><ul><li><b>أ.</b> مالك بيانات المراكز المجتمعية، لأنه يقرر في مشاركة بيانات مجاله</li><li><b>ب.</b> الموظف الذي يرسل البريد، لأنه أعرف الناس بالقائمة</li><li><b>ج.</b> المشرف الفني، لأنه يدير نظام التسجيل ويعرف حقوله</li><li><b>د.</b> لجنة إدارة البيانات، لأن البيانات شخصية</li></ul></li>
<li><p>في خدمة الرعاية المنزلية، تنقل الممرضة الزيارة من دفترها الورقي إلى النظام في آخر اليوم. أي مرحلة من دورة حياة البيانات هذه؟</p><ul><li><b>أ.</b> التخزين، لأن الزيارة تُحفظ في قاعدة بيانات النظام وتبقى فيها</li><li><b>ب.</b> الإنشاء والجمع، لأن السجل الرقمي يولد في النظام لحظة إدخاله</li><li><b>ج.</b> الاستخدام، لأن الممرضة تعمل بالبيانات حين تكتبها في آخر يوم العمل</li><li><b>د.</b> الأرشفة، لأن الدفتر الورقي يُترك بعد النقل</li></ul></li>
<li><p>تريد هيئة عامة أن تعرف كم مرة طلب أفراد معلومات عنها هذا العام وكم ردًّا تأخر عن مهلته. في أي مجال من مجالات المعيار الوطني يقع مخرج العمل الذي يجيب؟</p><ul><li><b>أ.</b> البيانات المفتوحة، لأن الطلبات تأتي من الجمهور</li><li><b>ب.</b> تكامل البيانات ومشاركتها، لأن الرد مشاركة مع طرف آخر</li><li><b>ج.</b> حرية المعلومات، لأن سجل الطلبات وردودها مخرج هذا المجال</li><li><b>د.</b> ذكاء الأعمال والتحليلات، لأن الأعداد تُحسب في لوحة</li></ul></li>
<li><p>تسجّل أصول المراكز المجتمعية. المسح وجد جدول «حجوزات القاعات» وجدولًا آخر بالاسم نفسه ينتهي بـ _test فيه عشرون حجزًا وهميًا. ماذا تكتب في السجل؟</p><ul><li><b>أ.</b> أصلين منفصلين، لكل منهما مالكه ومصدره، حتى لا يفوت السجل أي جدول وجده المسح</li><li><b>ب.</b> أصلًا واحدًا هو حجوزات القاعات، وجدول الاختبار لا يُسجل</li><li><b>ج.</b> لا شيء حتى يقرر قسم التقنية أي الجدولين هو الأصل</li><li><b>د.</b> جدول الاختبار وحده لأنه أصغر وأسهل في التوثيق، ثم يُضاف الآخر في المرحلة الثانية</li></ul></li>
<li><p>يسأل مدير في مَعين: «عندنا إطار مجموعة المعارف لإدارة البيانات، فما الذي تضيفه الضوابط الوطنية؟» أي إجابة أدق؟</p><ul><li><b>أ.</b> ضوابط ومواصفات يُقاس الامتثال لكل منها بأدلة</li><li><b>ب.</b> قائمة بمجالات المعارف التي تتكون منها إدارة البيانات وتعريف كل مجال منها</li><li><b>ج.</b> تعريفًا لحوكمة البيانات ودورها</li><li><b>د.</b> قائمة بالأدوات والمنصات التقنية المعتمدة التي يجب أن تشتريها كل جهة</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: المعنى والمسار</h2>
<ol>
<li><p>في المراكز المجتمعية، طلب مدرب قائمة المشتركين بأرقام جوالاتهم. أعدّ المنسق القائمة، وينتظر المشرف الفني من يقول له «أرسل». من يقول ذلك؟</p><ul><li><b>أ.</b> المنسق، لأنه أعدّ القائمة وراجع أسماءها</li><li><b>ب.</b> الرئيس التنفيذي للبيانات</li><li><b>ج.</b> مالك بيانات المراكز المجتمعية</li><li><b>د.</b> المشرف الفني نفسه، لأنه من سيرسل الملف</li></ul></li>
<li><p>مدخل في قاموس الرعاية المنزلية: «مقدم الرعاية: الشخص الذي يقدم الرعاية للمستفيد في منزله. المالك: مديرة الرعاية. المشرف: منسقة الزيارات. المصدر: دليل الخدمة. الحالة: مسودة.» أي بند من القائمة لا يجتازه؟</p><ul><li><b>أ.</b> البند الثالث: التعريف دائري يعيد الكلمة</li><li><b>ب.</b> البند السادس: المالك والمشرف غير مذكورين معًا</li><li><b>ج.</b> البند السابع: المصدر غير مذكور في المدخل</li><li><b>د.</b> البند الرابع: لا قاعدة حساب للمصطلح</li></ul></li>
<li><p>عددتَ «الزيارات المكتملة» بتعريفين في الرعاية المنزلية وحصلت على رقمين. ما أنفع ما تقدمه لمديرة الرعاية قبل أن تقرر؟</p><ul><li><b>أ.</b> الفرق الصافي بين الرقمين مع نسبته المئوية</li><li><b>ب.</b> التعريف الأصح في رأيك مع تبريره المكتوب</li><li><b>ج.</b> متوسط الرقمين حلًّا وسطًا بين الفريقين</li><li><b>د.</b> المجموعات المختلفة وعددها وسبب كل منها</li></ul></li>
<li><p>رسمت مسار عدد زيارات الرعاية من النظام إلى خطاب الوزارة، وأعدت الحساب بتحويلاته، فخرج رقم أكبر من المنشور. ما أرجح تفسير؟</p><ul><li><b>أ.</b> النظام يحسب الزيارات خطأ ويجب إصلاحه</li><li><b>ب.</b> في المسار خطوة لم تُرسم تحذف صفوفًا</li><li><b>ج.</b> النسخ الليلي يُسقط بعض الصفوف</li><li><b>د.</b> الفرق صغير ويمكن إهماله في التقرير الشهري</li></ul></li>
<li><p>في مدخل كتالوج «سجل الزيارات» في الرعاية المنزلية، حقل «مدة الحفظ المعتمدة: خمس سنوات». من أين يأتي؟</p><ul><li><b>أ.</b> تسحبه الأداة من تاريخ أقدم سجل في الجدول</li><li><b>ب.</b> تقترحه الأداة بنموذج لغوي من وصف الجدول</li><li><b>ج.</b> يكتبه إنسان من سياسة الحفظ التي اعتمدتها اللجنة</li><li><b>د.</b> يستنتجه المشرف الفني من إعدادات النسخ الاحتياطي</li></ul></li>
<li><p>يختلف مالكا بيانات في مَعين على تعريف «زيارة مكتملة»، ولم يتفقا بعد اجتماعين. من يحسم الخلاف بحسب هيكل الحوكمة؟</p><ul><li><b>أ.</b> مكتب إدارة البيانات، لأنه يكتب مسودات القاموس</li><li><b>ب.</b> المشرف الفني، لأنه يعرف كيف يُحسب الرقم في النظام فعلًا</li><li><b>ج.</b> لجنة إدارة البيانات، لأنها تحسم ما لا يتفق عليه المالكون</li><li><b>د.</b> مسؤول حماية البيانات الشخصية، لأن فيها بيانات أفراد</li></ul></li>
<li><p>أي تعريف لـ«زيارة مكتملة» في قاموس الرعاية المنزلية يتبع قاعدة الجنس ثم الفصل؟</p><ul><li><b>أ.</b> زيارة منزلية مجدولة حضرتها الممرضة وسجلت نتيجتها</li><li><b>ب.</b> الزيارة التي اكتملت بحسب ما يظهر في النظام وفي تقارير الخدمة الشهرية</li><li><b>ج.</b> تُحسب بتصفية عمود الحالة على «تمت» ثم العدّ</li><li><b>د.</b> مثل زيارة الأحد الماضي في حي النرجس التي حضرتها الممرضة في موعدها</li></ul></li>
<li><p>في مسار تقرير الرعاية الشهري، أي خطوة تُرسم في مخطط التتبع على أنها تحويل؟</p><ul><li><b>أ.</b> نسخ ملف الزيارات من النظام إلى المجلد المشترك كما هو</li><li><b>ب.</b> استبعاد الزيارات الملغاة قبل العدّ، لأنه يغير الرقم</li><li><b>ج.</b> إعادة تسمية الملف بتاريخ الشهر</li><li><b>د.</b> إرسال التقرير بالبريد إلى مديرة الخدمة كل يوم أحد في الصباح</li></ul></li>
<li><p>في كتالوج مَعين، حقل «آخر تحديث للجدول: أمس الساعة 2 فجرًا». أي نوع من البيانات الوصفية هذا؟</p><ul><li><b>أ.</b> أعمال، لأن المستخدمين يحتاجونه ليثقوا بالأرقام في تقاريرهم</li><li><b>ب.</b> تقنية، لأن النظام يسجله آليًا عند كل تشغيل ويحفظه في قاعدته</li><li><b>ج.</b> تشغيلية، لأنه يصف ما يحدث للجدول في التشغيل</li><li><b>د.</b> ليست بيانات وصفية، بل جزء من الجدول</li></ul></li>
<li><p>أي حقل في مدخل كتالوج لجدول الزيارات يجب أن يكتبه شخص ولا يمكن حصاده من النظام؟</p><ul><li><b>أ.</b> عدد الأعمدة ونوع كل عمود، لأن الشخص أدق من الأداة في وصفها</li><li><b>ب.</b> تاريخ آخر تحديث، لأن المستخدم يحتاج من يؤكده له دائمًا</li><li><b>ج.</b> عدد الصفوف في الجدول عند آخر قراءة له من النظام</li><li><b>د.</b> المالك والتعريف: قرار أعمال لا يعرفه النظام</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 3: الحماية والجودة والقياس</h2>
<ol>
<li><p>في المراكز المجتمعية، «المشترك النشط» عند المراكز من حضر نشاطًا هذا الشهر، وعند التخطيط من له اشتراك ساري. ما المخرج الذي يحسم الخلاف؟</p><ul><li><b>أ.</b> مدخل كتالوج لجدول الاشتراكات</li><li><b>ب.</b> مدخل قاموس يعتمده المالك ويسمّي الرقم الآخر</li><li><b>ج.</b> مخطط تتبع أصل يوضح مصدر كل رقم من الرقمين</li><li><b>د.</b> قاعدة جودة جديدة على عمود تاريخ الحضور في المراكز</li></ul></li>
<li><p>ملف واحد في الرعاية المنزلية يجمع قائمة الأحياء المخدومة (عامة) مع أسماء المستفيدين وتشخيصاتهم (سرية). ما مستواه المبدئي؟</p><ul><li><b>أ.</b> عام، لأن معظم صفحاته قائمة الأحياء المنشورة</li><li><b>ب.</b> مقيد، حلًّا وسطًا بين المستويين</li><li><b>ج.</b> سري للغاية، احتياطًا لأن فيه بيانات صحية</li><li><b>د.</b> سري، لأن أعلى مستوى في الملف يسري</li></ul></li>
<li><p>في سجل زيارات الرعاية، عمود «النتيجة» مملوء في كل الصفوف، لكن فيه قيم مثل «تم» و«ok» و«؟» غير موجودة في القائمة المعتمدة. أي بعد يقيس هذه المشكلة؟</p><ul><li><b>أ.</b> الصلاحية، لأن القيم خارج القائمة المعتمدة</li><li><b>ب.</b> الاكتمال، لأن القيمة الصحيحة غير موجودة</li><li><b>ج.</b> الدقة، لأن القيمة لا تصف ما حدث في المنزل</li><li><b>د.</b> الاتساق، لأن القيم تختلف من ممرضة إلى أخرى</li></ul></li>
<li><p>تطلب جامعة قائمة مستفيدي الرعاية المنزلية بأسمائهم وتشخيصاتهم لدراسة عن الشيخوخة، وسؤالها البحثي يحتاج أعداد الحالات حسب العمر فقط. ما القرار الأنسب؟</p><ul><li><b>أ.</b> ترسل القائمة كاملة لأن البحث يخدم الصالح العام</li><li><b>ب.</b> ترفض الطلب لأن فيه بيانات صحية لأفراد</li><li><b>ج.</b> تعرض أعدادًا مجمعة حسب العمر تكفي سؤالها</li><li><b>د.</b> ترسلها بعد أن تطلب من الجامعة توقيع تعهد</li></ul></li>
<li><p>في المراكز المجتمعية: سياسة لحفظ سجلات المشتركين معتمدة وموقعة منذ سنة، ولم يُنقل أو يُتلف أي سجل بموجبها. ما الدرجة على المقياس؟</p><ul><li><b>أ.</b> 0، لأنه لم يحدث شيء بعدها</li><li><b>ب.</b> 2، لأنها معتمدة ولم تُشغَّل بعد</li><li><b>ج.</b> 3، لأنها معتمدة وموقعة من صاحب الصلاحية</li><li><b>د.</b> 1، لأن الحفظ يتم بمبادرات فردية من الموظفين</li></ul></li>
<li><p>تريد خدمة الرعاية المنزلية نشر قائمة الأحياء التي تغطيها الخدمة على البوابة ليقرأها الجمهور ويعيد استعمالها. أي مجال من مجالات المعيار الوطني يحكم هذا الطلب؟</p><ul><li><b>أ.</b> تكامل البيانات ومشاركتها، لأنها ستخرج من الهيئة</li><li><b>ب.</b> حرية المعلومات، لأن الجمهور سيطلع عليها</li><li><b>ج.</b> تصنيف البيانات، لأن النشر يحتاج مستوى أولًا</li><li><b>د.</b> البيانات المفتوحة، لأن الجهة تنشر للجمهور بمبادرتها</li></ul></li>
<li><p>في سجل زيارات الرعاية تواريخ في المستقبل. قرر المالك أن يمنع النظام إدخالها. من ينفذ هذا التغيير في حقل التاريخ؟</p><ul><li><b>أ.</b> مختص بيانات الأعمال، لأنه يكتب قاعدة الجودة</li><li><b>ب.</b> المالك، لأنه صاحب القرار في الإصلاح وأولويته</li><li><b>ج.</b> الرئيس التنفيذي للبيانات، لأن الجودة من مجالات الضوابط الوطنية</li><li><b>د.</b> المشرف الفني، لأنه ينفذ ما يقرره المالك</li></ul></li>
<li><p>عدد زيارات الرعاية لكل منطقة في السنة، والمناطق كلها كبيرة لا خلية فيها أقل من خمسة، ولا نظام يمنع الإفصاح. ما المستوى المبدئي؟</p><ul><li><b>أ.</b> عام، لأن الإفصاح لا أثر له ولا نظام يمنعه</li><li><b>ب.</b> مقيد، لأن الأرقام مشتقة من بيانات شخصية للمستفيدين</li><li><b>ج.</b> سري، لأن الخدمة صحية وكل ما يخصها حساس</li><li><b>د.</b> سري للغاية، احتياطًا حتى يقرر المالك غير ذلك</li></ul></li>
<li><p>بحسب سياسة تصنيف البيانات الوطنية، من يضع التصنيف الأولي لبيانات خدمة الرعاية المنزلية؟</p><ul><li><b>أ.</b> مسؤول الأمن السيبراني، لأن الضوابط تشتد مع ارتفاع المستوى</li><li><b>ب.</b> ممثل بيانات الأعمال، لأنه يقدّر الأثر</li><li><b>ج.</b> المشرف الفني للنظام، لأنه يعرف الحقول وأنواعها</li><li><b>د.</b> مكتب البيانات وحده، ثم يُبلغ المالك بالمستوى بعد اعتماده</li></ul></li>
<li><p>جدول زيارات من 400 صف. عمود النتيجة مملوء في 360 صفًا، و342 منها من القائمة المعتمدة. ما صلاحية العمود إذا قيست على المملوء؟</p><ul><li><b>أ.</b> 90%</li><li><b>ب.</b> 85.5%</li><li><b>ج.</b> 95%</li><li><b>د.</b> 5%</li></ul></li>
<li><p>نموذج قبول الرعاية المنزلية يطلب تاريخ ميلاد كل فرد يسكن مع المستفيد، والخدمة لا تحتاج إلا عمر المستفيد نفسه. أي مبدأ يخالفه النموذج؟</p><ul><li><b>أ.</b> الإتاحة هي الأصل، لأن البيانات لن تُنشر بعد جمعها</li><li><b>ب.</b> أعلى مستوى، لأن النموذج يجمع بيانات بمستويات مختلفة</li><li><b>ج.</b> حرية المعلومات، لأن الأسرة لم تسأل</li><li><b>د.</b> الحد الأدنى، لأن الخدمة لا تحتاج تواريخ الأسرة</li></ul></li>
<li><p>يريد موظف في مَعين لصق قائمة الأحياء المخدومة، وهي مصنفة «عامة» ومنشورة، في مساعد ذكاء اصطناعي عام ليصوغ منها إعلانًا. ما الحكم بحسب قاعدة المقرر؟</p><ul><li><b>أ.</b> يجوز، لأن القائمة عامة، والقيد يبدأ من مستوى مقيد</li><li><b>ب.</b> لا يجوز، لأن بيانات الهيئة لا تدخل أداة عامة</li><li><b>ج.</b> يجوز بعد موافقة مسؤول حماية البيانات الشخصية على كل استخدام</li><li><b>د.</b> لا يجوز إلا في أداة تعتمدها الجهة، مهما كان المستوى</li></ul></li>
<li><p>تقدّر مَعين نضج قاموس المصطلحات في الرعاية المنزلية. أي وثيقة تسند المستوى 3، معرّف ومطبّق؟</p><ul><li><b>أ.</b> قالب معتمد لمدخل القاموس، وحقوله فارغة</li><li><b>ب.</b> محضر يعتمد المصطلحات، وتقرير شهري يستعمل تعريفاتها</li><li><b>ج.</b> بريد من مدير يقول إن الفريق يستعمل القاموس</li><li><b>د.</b> وصف وظيفي لمختص القاموس، والوظيفة شاغرة منذ أشهر</li></ul></li>
<li><p>طبقت الرعاية المنزلية مواصفة من الضوابط الوطنية تطبيقًا جزئيًا. كم يُحتسب امتثالها في التقييم؟</p><ul><li><b>أ.</b> 50%، لأن نصف ما تطلبه المواصفة مطبق بالفعل</li><li><b>ب.</b> 100% إذا وُثّق ما طُبق</li><li><b>ج.</b> بحسب مستوى النضج الذي تقدره الجهة لنفسها في المجال</li><li><b>د.</b> 0%، لأن الاحتساب ثنائي لكل مواصفة</li></ul></li>
<li><p>لقطة نضج مَعين تظهر أن أغلب المجالات بلا مالك معين. أي إجراء يأتي أولًا في خطة السنة الأولى؟</p><ul><li><b>أ.</b> شراء أداة كتالوج تحصد البيانات الوصفية من الأنظمة كلها</li><li><b>ب.</b> نشر عشر مجموعات بيانات مفتوحة لرفع درجة المشاركة سريعًا</li><li><b>ج.</b> تعيين مالك لكل مجال، لأن القرارات الأخرى كلها تحتاجه</li><li><b>د.</b> تدريب الموظفين على أدوات الذكاء الاصطناعي التوليدي أولًا</li></ul></li>
<li><p>تتردد في درجة الجودة بين 2 و3: سياسة معتمدة، وقاعدة واحدة مقيسة في جدول واحد بلا سجل مشكلات. ماذا تكتب في اللقطة؟</p><ul><li><b>أ.</b> 2، مع الوثيقة التي تنقص للمستوى 3</li><li><b>ب.</b> 3، لأن الاختيار الأعلى يعطي الجهة حقها في التقدير</li><li><b>ج.</b> 2.5، لأن الحال بين المستويين تمامًا ولا يصفها أي منهما</li><li><b>د.</b> لا درجة حتى يكتمل سجل المشكلات في المجال</li></ul></li>
</ol>

تخرج من الهيئة"},{"key":"ب","text":"حرية المعلومات، لأن الجمهور سيطلع عليها"},{"key":"ج","text":"تصنيف البيانات، لأن النشر يحتاج مستوى أولًا"},{"key":"د","text":"البيانات المفتوحة، لأن الجهة تنشر للجمهور بمبادرتها"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"النشر للجمهور بصيغة يعاد استعمالها هو مجال البيانات المفتوحة. التصنيف «عام» شرط قبله، والمشاركة وحرية المعلومات طريقان آخران.","misconceptions":["يخلط بين المشاركة مع جهة محددة والنشر للجمهور","حرية المعلومات تجيب طلبًا يرد من فرد، والنشر هنا مبادرة من الجهة","التصنيف شرط يسبق النشر، لكنه ليس المجال الذي يحكم النشر نفسه",""],"lo":["LO1"],"day":3,"session":3,"slide":{"deck":"day3","id":"four-kinds-of-request","title":"طلبات تبدو متشابهة، ولكل منها مجال وطريق"},"level":"apply","pool":"practice"},{"id":"q-standard-dama-06","type":"single","prompt":"يسأل مدير في مَعين: «عندنا إطار مجموعة المعارف لإدارة البيانات، فما الذي تضيفه الضوابط الوطنية؟» أي إجابة أدق؟","options":[{"key":"أ","text":"ضوابط ومواصفات يُقاس الامتثال لكل منها بأدلة"},{"key":"ب","text":"قائمة بمجالات المعارف التي تتكون منها إدارة البيانات وتعريف كل مجال منها"},{"key":"ج","text":"تعريفًا لحوكمة البيانات ودورها"},{"key":"د","text":"قائمة بالأدوات والمنصات التقنية المعتمدة التي يجب أن تشتريها كل جهة"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الإطار يصف المعرفة والممارسة، والضوابط الوطنية تحولها إلى ضوابط ومواصفات ملزمة يُقاس الامتثال لها بأدلة.","misconceptions":["","الإطار نفسه يقدم مجالات المعارف وتعريفاتها، فهذه ليست إضافة","الإطار يضع الحوكمة في المركز أيضًا","لا الضوابط ولا الإطار يحددان منتجات بعينها"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"body-of-knowledge","title":"المهنة تصف نفسها في مجالات معارف، والحوكمة في وسطها"},"level":"understand","pool":"practice"},{"id":"q-dispute-07","type":"single","prompt":"يختلف مالكا بيانات في مَعين على تعريف «زيارة مكتملة»، ولم يتفقا بعد اجتماعين. من يحسم الخلاف بحسب هيكل الحوكمة؟","options":[{"key":"أ","text":"مكتب إدارة البيا nswer":null,"tolerance":null,"unit":null,"explanation":"وقت التحديث يصف ما يحدث للبيانات في التشغيل، فهو بيانات وصفية تشغيلية.","misconceptions":["الأعمال تصف المعنى والملكية، لا ما يحدث للجدول في التشغيل","التقنية تصف البنية: الأعمدة والأنواع، لا أحداث التشغيل","","وصف للجدول لا من محتواه، فهو بيانات وصفية"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"three-kinds-metadata","title":"ثلاثة أنواع من البيانات الوصفية، ولكل منها من يعرفه"},"level":"understand","pool":"practice"},{"id":"q-harvest-12","type":"single","prompt":"أي حقل في مدخل كتالوج لجدول الزيارات يجب أن يكتبه شخص ولا يمكن حصاده من النظام؟","options":[{"key":"أ","text":"عدد الأعمدة ونوع كل عمود، لأن الشخص أدق من الأداة في وصفها"},{"key":"ب","text":"تاريخ آخر تحديث، لأن المستخدم يحتاج من يؤكده له دائمًا"},{"key":"ج","text":"عدد الصفوف في الجدول عند آخر قراءة له من النظام"},{"key":"د","text":"المالك والتعريف: قرار أعمال لا يعرفه النظام"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المالك والتعريف قرارات أعمال لا يعرفها النظام، فيكتبها شخص. البنية والتحديث والحجم تُحصد.","misconceptions":["يقرأه الكتالوج من النظام آليًا","يسجله النظام في كل تشغيل","يُحصد آليًا",""],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"harvest-or-write","title":"الأداة تسحب ما في الأنظمة، ولا تعرف من يقرر"},"level":"apply","pool":"practice"},{"id":"q-level-public-14","type":"single","prompt":"عدد زيارات الرعاية لكل منطقة في السنة، والمناطق كلها كبيرة لا خلية فيها أقل من خمسة، ولا نظام يمنع الإفصاح. ما المستوى المبدئي؟","options":[{"key":"أ","text":"عام، لأن الإفصاح لا أثر له ولا نظام يمنعه"},{"key":"ب","text":"مقيد، لأن الأرقام مشتقة من بيانات شخصية للمستفيدين"},{"key":"ج","text":"سري، لأن الخدمة صحية وكل ما يخصها حساس"},{"key":"د","text":"سري للغاية، احتياطًا حتى يقرر المالك غير ذلك"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"لا أثر للإفصاح ولا مانع نظامي، فالأصل الإتاحة. الخلايا الصغيرة وحدها كانت سترفعه إلى مقيد.","misconceptions":["","الا "practice"},{"id":"q-minimum-17","type":"single","prompt":"نموذج قبول الرعاية المنزلية يطلب تاريخ ميلاد كل فرد يسكن مع المستفيد، والخدمة لا تحتاج إلا عمر المستفيد نفسه. أي مبدأ يخالفه النموذج؟","options":[{"key":"أ","text":"الإتاحة هي الأصل، لأن البيانات لن تُنشر بعد جمعها"},{"key":"ب","text":"أعلى مستوى، لأن النموذج يجمع بيانات بمستويات مختلفة"},{"key":"ج","text":"حرية المعلومات، لأن الأسرة لم تسأل"},{"key":"د","text":"الحد الأدنى، لأن الخدمة لا تحتاج تواريخ الأسرة"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المحتوى يقتصر على القدر اللازم للغرض. تواريخ ميلاد الأسرة تزيد على حاجة الخدمة.","misconceptions":["مبدأ للتصنيف والنشر، لا للجمع","مبدأ لتصنيف المجموعات المركبة، لا لما يُجمع","حرية المعلومات تخص طلبات المعلومات، لا نماذج الجمع",""],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"three-principles","title":"أساس نظامي، وغرض محدد، وحد أدنى من البيانات"},"level":"apply","pool":"practice"},{"id":"q-ai-public-18","type":"single","prompt":"يريد موظف في مَعين لصق قائمة الأحياء المخدومة، وهي مصنفة «عامة» ومنشورة، في مساعد ذكاء اصطناعي عام ليصوغ منها إعلانًا. ما الحكم بحسب قاعدة المقرر؟","options":[{"key":"أ","text":"يجوز، لأن القائمة عامة، والقيد يبدأ من مستوى مقيد"},{"key":"ب","text":"لا يجوز، لأن بيانات الهيئة لا تدخل أداة عامة"},{"key":"ج","text":"يجوز بعد موافقة مسؤول حماية البيانات الشخصية على كل استخدام"},{"key":"د","text":"لا يجوز إلا في أداة تعتمدها الجهة، مهما كان المستوى"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"البيانات العامة يجوز إدخالها في أداة عامة. القيد يبدأ من «مقيد».","misconceptions":["","القاعدة بحسب المستوى، والعام يجوز","لا بيانات شخصية فيها، فلا حاجة إلى موافقته","الأداة المعتمدة شرط للمقيد وما فوقه، لا للعام"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"ai-tools-rule","title":"ما يدخل الأداة يحدده مستوى البيانات، لا سهولة الأداة"},"level":"apply","pool":"practice"},{"id":"q-evidence-19","type":"single","prompt":"تقدّر مَعين نضج قاموس المصطلحات في الرعاية المنزلية. أي وثيقة تسند المستوى 3، معرّف ومطبّق؟","options":[{"key":"أ","text":"قالب معتمد لمدخل القاموس، وحقوله فارغة"},{"key":"ب","text":"محضر يعتمد المصطلحات، وتقرير شهري يستعمل تعريفاتها"},{"key":"ج","text":"بريد من مدير يقول إن الفريق يستعمل القاموس"},{"key":"د","text":"وصف وظيفي لمختص القاموس، والوظيفة شاغرة منذ أشهر"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"المستوى 3 يحتاج اعتمادًا وتشغيلًا: المحضر يثبت الاعتماد، والتقرير يثبت الاستعمال. القالب الفارغ والإفادة والوظيفة الشاغرة لا تثبت تشغيلًا.","misconceptions":["الاعتماد بلا محتوى لا يثبت أن شيئًا طُبق","","إفادة بلا وثيقة تثبتها","الدور على الورق دون من يشغله"],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"what-counts-as-evidence","title":"الدليل يثبت أن الشيء موجود، ومعتمد، ويعمل"},"level":"apply","pool":"practice"},{"id":"q-compliance-20","type":"single","prompt":"طبقت الرعاية المنزلية مواصفة من الضوابط الوطنية تطبيقًا جزئيًا. كم يُحتسب امتثالها في التقييم؟","options":[{"key":"أ","text":"50%، لأن نصف ما تطلبه المواصفة مطبق بالفعل"},{"key":"ب","text":"100% إذا وُثّق ما طُبق"},{"key":"ج","text":"بحسب مستوى النضج الذي تقدره الجهة لنفسها في المجال"},{"key":"د","text":"0%، لأن الاحتساب ثنائي لكل مواصفة"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"كل مواصفة 100% إذا طُبقت كاملة، و0% إذا طُبقت جزئيًا أو لم تطبق.","misconceptions":["الاحتساب ثنائي، لا نسبي","التوثيق لا يجعل الجزئي كاملًا","الامتثال والنضج قياسان مختلفان",""],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"compliance-vs-maturity","title":"الامتثال يسأل «هل هو موجود؟»، والنضج يسأل «هل يعمل؟»"},"level":"understand","pool":"practice"},{"id":"q-plan-order-21","type":"single","prompt":"لقطة نضج مَعين تظهر أن أغلب المجالات بلا مالك معين. أي إجراء يأتي أولًا في خطة السنة الأولى؟","options":[{"key":"أ","text":"شراء أداة كتالوج تحصد البيانات الوصفية من الأنظمة كلها"},{"key":"ب","text":"نشر عشر مجموعات بيانات مفتوحة لرفع درجة المشاركة سريعًا"},{"key":"ج","text
